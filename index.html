<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비공식듀오 | 프라이빗 소개</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#28232a;background:#faf7f6}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #eee4e5;position:sticky;top:0;z-index:5}.head{max-width:1100px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:21px;letter-spacing:-.8px;color:#a74463}.sub{font-size:12px;color:#93878c}.wrap{max-width:1100px;margin:35px auto;padding:0 20px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 9px}h2{font-size:21px;margin:0 0 16px}p{line-height:1.65}.muted{color:#8d8389}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}.btn{border:0;border-radius:11px;padding:11px 17px;background:#a74463;color:white;font-weight:700}.btn.alt{background:#f5e8ed;color:#9e3d5d}.btn.ghost{background:white;border:1px solid #e9dfe2;color:#64515b}.btn.danger{background:#a62643}.btn:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}.card{background:white;border:1px solid #eee3e6;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #5c28320b}.cover{height:230px;background:linear-gradient(140deg,#f5dfe7,#e8e4f1);display:flex;align-items:center;justify-content:center;color:#ab8d9a;font-size:48px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cardbody{padding:17px}.card h3{margin:0 0 7px;font-size:19px}.pill{display:inline-block;background:#f6e7ec;color:#9e3d5d;border-radius:30px;padding:5px 9px;font-size:12px;font-weight:700}.line{font-size:13px;color:#81767c;margin:6px 0}.panel{background:white;border:1px solid #eee3e6;border-radius:17px;padding:24px;margin-bottom:22px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}.field.full{grid-column:1/-1}input,textarea,select{width:100%;border:1px solid #e2d7dc;border-radius:10px;background:white;padding:11px 12px;outline-color:#b75b79}textarea{min-height:88px;resize:vertical}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button.active{background:#a74463;color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}.entry{border:1px solid #eee4e7;border-radius:12px;padding:14px}.small{font-size:13px}.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.check{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #eee4e7;border-radius:10px;font-size:14px}.check input{width:auto}.hide{display:none!important}.login{max-width:430px;margin:90px auto}.photo-preview{display:flex;gap:8px;flex-wrap:wrap}.photo-preview img{width:76px;height:76px;object-fit:cover;border-radius:10px}.modal{position:fixed;inset:0;background:#201219a8;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{background:white;max-width:670px;width:100%;max-height:92vh;overflow:auto;border-radius:18px;padding:24px}.gallery{display:flex;gap:8px;overflow-x:auto}.gallery img{width:180px;height:220px;object-fit:cover;border-radius:12px}.notice{background:#fff4e6;border:1px solid #f2d4aa;padding:14px;border-radius:12px;font-size:13px}.empty{text-align:center;padding:55px 15px;color:#8c7c83}.error{color:#b62d49}.success{color:#287953}.footer{margin:40px 0;color:#93868c;font-size:12px;text-align:center}@media(max-width:600px){.wrap{margin:24px auto}.fields{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:180px}.cardbody{padding:12px}.card h3{font-size:16px}.dialog{padding:17px}.gallery img{width:150px;height:190px}h1{font-size:25px}}
</style></head><body><header><div class="head"><div><div class="brand">♡ 비공식듀오</div><div class="sub">레드크리스탈 중매사가 엄선한 프로필</div></div><div id="headerRight"></div></div></header><main class="wrap" id="app"></main><div id="modal" class="modal hide"></div><script>
const app=document.getElementById('app'),modal=document.getElementById('modal'),headerRight=document.getElementById('headerRight');let profiles=[],invites=[],editing=null,photos=[],publicToken=new URLSearchParams(location.search).get('invite');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);const api=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j=await r.json();if(!r.ok)throw Error(j.error||'오류');return j};const notify=(msg)=>alert(msg);
function showModal(html){modal.innerHTML=`<div class="dialog">${html}</div>`;modal.classList.remove('hide')}function closeModal(){modal.classList.add('hide');modal.innerHTML=''}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
function card(p){const age=p.birthYear?new Date().getFullYear()-p.birthYear+1+'세':'나이 비공개';return `<article class="card"><div class="cover">${p.photos?.[0]?`<img src="${p.photos[0]}" alt="프로필 사진">`:'♡'}</div><div class="cardbody"><h3>${esc(p.name)} · ${age}</h3><div class="line">${esc(p.job||'직업 비공개')}</div><div class="line">${esc(p.region||'지역 비공개')} ${p.height?'· '+p.height+'cm':''}</div><div class="row" style="margin-top:12px"><span class="pill">${esc(p.status)}</span><button class="btn ghost small" onclick="detail('${p.id}')">자세히</button></div></div></article>`}
function detail(id){const p=profiles.find(x=>x.id===id);if(!p)return;showModal(`<div class="row"><h2>${esc(p.name)}님의 프로필</h2><button class="btn ghost" onclick="closeModal()">닫기</button></div><div class="gallery">${(p.photos||[]).map(s=>`<img src="${s}" alt="프로필 사진">`).join('')||'<div class="cover" style="width:100%;height:170px">♡</div>'}</div><p><span class="pill">${esc(p.status)}</span></p><p><b>성별</b> ${esc(p.gender)}　<b>출생연도</b> ${esc(p.birthYear||'비공개')}　<b>키</b> ${esc(p.height||'비공개')}</p><p><b>거주지</b> ${esc(p.region||'비공개')}<br><b>직업</b> ${esc(p.job||'비공개')}</p><h3>자기소개</h3><p style="white-space:pre-wrap">${esc(p.intro||'등록된 소개가 없습니다.')}</p><h3>이상형</h3><p style="white-space:pre-wrap">${esc(p.ideal||'등록된 내용이 없습니다.')}</p><div class="notice">관심 있는 분이 있다면 초대 링크를 전달해준 소개자에게 문의해주세요. 프로필이나 사진을 동의 없이 재공유하지 마세요.</div>`)}
async function guest(){headerRight.innerHTML='<span class="pill">초대 전용</span>';try{const j=await api('/api/public?token='+encodeURIComponent(publicToken));profiles=j.profiles;app.innerHTML=`<h1>좋은 인연을 만나보세요 ♡</h1><p class="muted">초대받은 분에게만 공개된 프로필입니다. ${j.invite.expiresAt?'· 열람 기한 '+new Date(j.invite.expiresAt).toLocaleDateString('ko-KR'):''}</p><div class="toolbar"><input id="search" placeholder="이름, 직업, 지역 검색" style="max-width:320px" oninput="guestCards()"><select id="genderFilter" style="max-width:150px" onchange="guestCards()"><option value="">전체 성별</option><option>남성</option><option>여성</option><option>기타</option></select></div><div id="guestCards"></div><p class="footer">본 정보는 소개 목적으로만 제공됩니다. 무단 저장·전달·재배포를 금지합니다.</p>`;guestCards()}catch(e){app.innerHTML=`<div class="panel empty"><h2>초대 링크를 확인해주세요</h2><p>${esc(e.message)}</p><p>새로운 초대 링크는 소개자에게 요청해주세요.</p></div>`}}
function guestCards(){const q=($('search')?.value||'').toLowerCase(),g=$('genderFilter')?.value||'';const arr=profiles.filter(p=>(!g||p.gender===g)&&[p.name,p.job,p.region].join(' ').toLowerCase().includes(q));$('guestCards').innerHTML=arr.length?`<div class="cards">${arr.map(card).join('')}</div>`:'<div class="empty">조건에 맞는 프로필이 없습니다.</div>'}

async function tabAdmins(){if(window.adminUser?.role!=='owner')return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));$('tabA').classList.add('active');$('panelP').classList.add('hide');$('panelI').classList.add('hide');$('panelA').classList.remove('hide');const d=await api('/api/admins');$('panelA').innerHTML=`<div class="panel"><h2>관리자 추가</h2><p class="muted small">추가 관리자는 프로필과 초대 링크를 관리할 수 있지만 다른 관리자를 추가할 수는 없습니다.</p><form onsubmit="addAdmin(event)" class="stack"><label class="field">이름<input id="aName" maxlength="40" required></label><label class="field">로그인 아이디 (영문 소문자·숫자·밑줄 4~30자)<input id="aUsername" pattern="[a-z0-9_]{4,30}" required></label><label class="field">임시 비밀번호 (12자 이상)<input id="aPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button class="btn">관리자 추가</button></form></div><div class="panel"><h2>관리자 목록</h2><div class="stack">${d.admins.map(a=>`<div class="entry row"><div><b>${esc(a.name)}</b> · ${esc(a.username)} <span class="pill">${a.role==='owner'?'최고 관리자':a.active?'활성':'비활성'}</span></div>${a.role==='owner'?'':`<div><button class="btn alt" onclick="resetAdminPassword('${a.id}')">비밀번호 변경</button> <button class="btn ${a.active?'danger':'alt'}" onclick="setAdminActive('${a.id}',${!a.active})">${a.active?'권한 해제':'재활성화'}</button></div>`}</div>`).join('')}</div></div>`}
async function addAdmin(e){e.preventDefault();try{await api('/api/admins',{method:'POST',body:JSON.stringify({name:$('aName').value,username:$('aUsername').value,password:$('aPassword').value})});await tabAdmins()}catch(e){notify(e.message)}}
async function setAdminActive(id,active){if(!confirm(active?'관리자 권한을 다시 부여할까요?':'이 관리자의 접근 권한을 해제할까요?'))return;try{await api('/api/admins/'+id,{method:'PATCH',body:JSON.stringify({active})});await tabAdmins()}catch(e){notify(e.message)}}
async function resetAdminPassword(id){const password=prompt('새 비밀번호 (12자 이상)');if(password===null)return;try{await api('/api/admins/'+id,{method:'PATCH',body:JSON.stringify({password})});notify('비밀번호가 변경되었습니다.');await tabAdmins()}catch(e){notify(e.message)}}

async function boot(){if(publicToken)return guest();const s=await api('/api/session');if(s.admin)admin();else login()}
function login(){headerRight.innerHTML='';app.innerHTML=`<div class="panel login"><h1>관리자 로그인</h1><p class="muted">관리자만 프로필을 등록하고 초대 링크를 발급할 수 있습니다.</p><form onsubmit="doLogin(event)"><label class="field">관리자 아이디<input id="username" value="owner" required autocomplete="username"></label><label class="field">비밀번호<input id="password" type="password" required autocomplete="current-password"></label><p><button class="btn" style="width:100%">로그인</button></p><p id="loginError" class="error small"></p></form></div>`}
async function doLogin(e){e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});admin()}catch(e){$('loginError').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});login()}
async function admin(){try{const d=await api('/api/admin');const session=await api('/api/session');window.adminUser=session.user;profiles=d.profiles;invites=d.invites;headerRight.innerHTML='<button class="btn ghost" onclick="logout()">로그아웃</button>';app.innerHTML=`<div class="row"><div><h1>관리자 대시보드</h1><p class="muted">프로필 ${profiles.length}명 · 초대 링크 ${invites.length}개 · ${esc(window.adminUser.name)}</p></div><button class="btn" onclick="editProfile()">+ 프로필 등록</button></div><div class="tabs"><button class="btn alt active" id="tabP" onclick="tab('p')">프로필 관리</button><button class="btn alt" id="tabI" onclick="tab('i')">초대 링크 관리</button>${window.adminUser.role==='owner'?'<button class="btn alt" id="tabA" onclick="tabAdmins()">관리자 관리</button>':''}</div><section id="panelP"><div class="cards">${profiles.map(p=>`<div>${card(p)}<div class="row" style="padding:8px"><button class="btn alt" onclick="editProfile('${p.id}')">수정</button><button class="btn ghost" onclick="removeProfile('${p.id}')">삭제</button></div></div>`).join('')}</div>${!profiles.length?'<div class="empty">등록된 프로필이 없습니다. 첫 프로필을 등록해보세요.</div>':''}</section><section id="panelI" class="hide"><div class="panel"><h2>새 초대 링크 발급</h2><label class="field">초대 대상 구분 이름<input id="inviteLabel" placeholder="예: 11월 소개팅 A님" maxlength="60"></label><p class="small muted">이 초대 링크에서 볼 수 있는 프로필을 선택하세요.</p><div class="checklist">${profiles.map(p=>`<label class="check"><input type="checkbox" class="pick" value="${p.id}">${esc(p.name)} · ${esc(p.gender)}</label>`).join('')||'먼저 프로필을 등록하세요.'}</div><p><label class="field">유효기간(일)<input type="number" id="inviteDays" min="1" max="90" value="7"></label></p><button class="btn" onclick="createInvite()">초대 링크 생성</button></div><div class="panel"><h2>발급한 초대 링크</h2><div class="stack">${invites.map(i=>`<div class="entry row"><div><b>${esc(i.label)}</b> <span class="pill">${i.active&&new Date(i.expiresAt)>new Date()?'활성':'비활성/만료'}</span><div class="line">공개 프로필 ${i.profileIds.length}명 · 만료 ${new Date(i.expiresAt).toLocaleString('ko-KR')}</div></div><button class="btn ${i.active?'danger':'alt'}" onclick="toggleInvite('${i.id}',${!i.active})">${i.active?'접근 차단':'다시 활성화'}</button></div>`).join('')||'<div class="empty">아직 발급한 초대 링크가 없습니다.</div>'}</div></div></section><section id="panelA" class="hide"></section><p class="footer">관리자 페이지 · 민감한 개인정보는 본인 동의 후 등록하세요.</p>`}catch(e){notify(e.message);login()}}
function tab(t){$('panelA')?.classList.add('hide');$('tabA')?.classList.remove('active');$('panelP').classList.toggle('hide',t!=='p');$('panelI').classList.toggle('hide',t!=='i');$('tabP').classList.toggle('active',t==='p');$('tabI').classList.toggle('active',t==='i')}
function editProfile(id){editing=id||null;const p=profiles.find(x=>x.id===id)||{};photos=[...(p.photos||[])];showModal(`<div class="row"><h2>${id?'프로필 수정':'새 프로필 등록'}</h2><button class="btn ghost" onclick="closeModal()">닫기</button></div><form onsubmit="saveProfile(event)"><div class="fields"><label class="field">표시 이름 또는 별명 *<input id="fName" required maxlength="40" value="${esc(p.name||'')}"></label><label class="field">성별 *<select id="fGender" required><option value="">선택</option>${['남성','여성','기타'].map(v=>`<option ${p.gender===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">출생연도<input id="fBirth" type="number" min="1900" max="${new Date().getFullYear()-19}" value="${p.birthYear||''}"></label><label class="field">키(cm)<input id="fHeight" type="number" min="100" max="250" value="${p.height||''}"></label><label class="field">거주 지역<input id="fRegion" maxlength="80" value="${esc(p.region||'')}"></label><label class="field">직업<input id="fJob" maxlength="100" value="${esc(p.job||'')}"></label><label class="field">소개 상태<select id="fStatus">${['소개 가능','진행 중','소개 완료'].map(v=>`<option ${p.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field full">자기소개<textarea id="fIntro" maxlength="1500">${esc(p.intro||'')}</textarea></label><label class="field full">이상형<textarea id="fIdeal" maxlength="1000">${esc(p.ideal||'')}</textarea></label><label class="field full">사진 최대 5장 (각 사진 약 1.5MB 이하)<input id="fPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="addPhotos(event)"><div id="preview" class="photo-preview"></div><button type="button" class="btn ghost" onclick="photos=[];renderPhotos()">사진 전체 제거</button></label><label class="field full"><span><input type="checkbox" id="fConsent" style="width:auto" ${p.consent?'checked':''} required> 본인에게 사진 및 프로필의 등록·초대 대상 공개 동의를 받았습니다. *</span></label></div><p><button class="btn" type="submit">${id?'수정 저장':'프로필 등록'}</button></p><p id="formError" class="error small"></p></form>`);renderPhotos()}
function renderPhotos(){$('preview').innerHTML=photos.map((s,i)=>`<div><img src="${s}"><button class="btn ghost small" type="button" onclick="photos.splice(${i},1);renderPhotos()">제거</button></div>`).join('')}
async function addPhotos(e){const files=[...e.target.files];if(files.length+photos.length>5){notify('사진은 최대 5장입니다.');return}for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>1800000){notify('JPG/PNG/WebP 파일만, 파일당 1.8MB 이하로 등록해주세요.');continue}const v=await new Promise(resolve=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.readAsDataURL(f)});photos.push(v)}renderPhotos()}
async function saveProfile(e){e.preventDefault();const val={name:$('fName').value,gender:$('fGender').value,birthYear:$('fBirth').value,height:$('fHeight').value,region:$('fRegion').value,job:$('fJob').value,status:$('fStatus').value,intro:$('fIntro').value,ideal:$('fIdeal').value,photos,consent:$('fConsent').checked};try{await api(editing?'/api/profiles/'+editing:'/api/profiles',{method:editing?'PUT':'POST',body:JSON.stringify(val)});closeModal();admin()}catch(err){$('formError').textContent=err.message}}
async function removeProfile(id){if(!confirm('이 프로필을 삭제할까요? 초대 링크에서도 제거됩니다.'))return;try{await api('/api/profiles/'+id,{method:'DELETE'});admin()}catch(e){notify(e.message)}}
async function createInvite(){const profileIds=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);try{const j=await api('/api/invites',{method:'POST',body:JSON.stringify({label:$('inviteLabel').value,profileIds,days:Number($('inviteDays').value)})});showModal(`<h2>초대 링크가 생성되었습니다 ♡</h2><p>아래 주소를 복사해서 카카오톡으로 전달하세요. <b>링크는 지금만 표시되므로 반드시 복사해두세요.</b></p><textarea id="newLink" readonly>${esc(j.url)}</textarea><p><button class="btn" onclick="copyLink()">링크 복사</button> <button class="btn ghost" onclick="closeModal();admin();tab('i')">완료</button></p><div class="notice">이 링크를 가진 사람은 지정된 프로필을 열람할 수 있습니다. 신뢰할 수 있는 사람에게만 전달하세요.</div>`)}catch(e){notify(e.message)}}
async function copyLink(){try{await navigator.clipboard.writeText($('newLink').value);notify('링크를 복사했습니다.')}catch{ $('newLink').select();notify('주소를 선택했습니다. 직접 복사해주세요.')}}
async function toggleInvite(id,active){try{await api('/api/invites/'+id,{method:'PATCH',body:JSON.stringify({active})});await admin();tab('i')}catch(e){notify(e.message)}}
boot().catch(e=>app.innerHTML=`<p class="error">연결 오류: ${esc(e.message)}</p>`);
</script></body></html>
